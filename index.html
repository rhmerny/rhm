<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RHM ERNY // SHADOW HOST</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--violet:#c86bff;--violet2:#7d31d4;--bg:#050208;--line:rgba(220,171,255,.16);--muted:#a69aac}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:Inter,Segoe UI,system-ui,sans-serif;color:#fff;background:var(--bg) url('rhm-erny-bg.png') center/cover fixed no-repeat;display:grid;place-items:center}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(3,1,7,.91),rgba(6,2,11,.56),rgba(3,1,7,.9)),linear-gradient(180deg,rgba(4,1,8,.32),rgba(4,1,8,.88));pointer-events:none}
.shell{position:relative;width:min(760px,calc(100vw - 34px));border:1px solid var(--line);border-radius:24px;background:rgba(8,4,14,.84);box-shadow:0 40px 120px rgba(0,0,0,.72),0 0 70px rgba(150,58,225,.12);overflow:hidden;backdrop-filter:blur(18px);animation:enter .65s ease both}
.card{padding:30px 32px 24px}
.brand{display:flex;align-items:center;justify-content:space-between;padding-bottom:20px;margin-bottom:24px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand-left{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,#d58aff,#7728d2);font-size:18px;color:#17051e;box-shadow:0 8px 25px rgba(180,71,255,.22)}
.brand h1{font-size:18px;letter-spacing:.14em}.brand span{display:block;margin-top:4px;color:#85778e;font:800 8px Consolas,monospace;letter-spacing:.18em}.live{font:800 8px Consolas,monospace;color:#bfffdc;border:1px solid rgba(120,255,200,.16);background:rgba(100,255,180,.04);padding:7px 10px;border-radius:999px}.live i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#9dffcc;box-shadow:0 0 10px #9dffcc;margin-right:6px}
.login-head{margin-bottom:20px}.eyebrow{font:800 8px Consolas,monospace;letter-spacing:.22em;color:#b66cff;margin-bottom:9px}.login-head h2{font-size:29px;letter-spacing:-.04em;margin-bottom:7px}.login-head p{font-size:12px;color:var(--muted);line-height:1.55}
.session-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:13px}.field{min-width:0}.field label{display:block;color:#796c82;font:800 8px Consolas,monospace;letter-spacing:.15em;margin:0 0 6px 3px}.input{height:46px;border:1px solid rgba(220,171,255,.11);border-radius:10px;background:rgba(255,255,255,.035);display:flex;align-items:center;padding:0 13px;color:#eee6f4;font-size:12px}.input .dot{width:7px;height:7px;border-radius:50%;background:#c36aff;box-shadow:0 0 12px #c36aff;margin-right:9px}.input.password{letter-spacing:.25em;color:#9e91a6}
.status{padding:16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.025)}.status-row{display:flex;justify-content:space-between;margin-bottom:9px}.status-label,.status-value{font:800 8px Consolas,monospace;letter-spacing:.13em}.status-label{color:#96889e}.status-value{color:#d08aff}.track{height:7px;border-radius:99px;background:#170d1e;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#7927cf,#be60ff,#e39cff);box-shadow:0 0 16px rgba(200,98,255,.55);transition:width .16s}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px}.step{font:800 8px Consolas,monospace;color:#655a6c;border:1px solid rgba(255,255,255,.06);border-radius:8px;padding:8px 5px;text-align:center}.step.active,.step.done{color:#ead4f8;border-color:rgba(210,128,255,.22);background:rgba(184,81,255,.06)}.footer{display:flex;justify-content:space-between;margin-top:16px;color:#66596e;font:700 8px Consolas,monospace;letter-spacing:.09em}.corner{color:#a57bb5}@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@media(max-width:600px){.card{padding:24px 20px 19px}.session-grid{grid-template-columns:1fr}.live{display:none}.login-head h2{font-size:25px}}
</style>
</head>
<body>
<main class="shell">
<section class="card">
  <div class="brand">
    <div class="brand-left">
      <div class="logo">♛</div>
      <div><h1>RHM ERNY</h1><span>SHADOW DRAGON // PRIVATE HOST</span></div>
    </div>
    <div class="live"><i></i>SESSION</div>
  </div>
  <div class="login-head">
    <div class="eyebrow">SECURE INITIALIZATION</div>
    <h2>Connexion automatique</h2>
    <p>Préparation de l'interface RHM ERNY et vérification de la session…</p>
  </div>
  <div class="session-grid">
    <div class="field">
      <label>PROFILE</label>
      <div class="input"><i class="dot"></i>RHM ERNY</div>
    </div>
    <div class="field">
      <label>SESSION</label>
      <div class="input password">••••••••••••</div>
    </div>
  </div>
  <div class="status">
    <div class="status-row">
      <span class="status-label" id="status">AUTHENTICATING SESSION</span>
      <span class="status-value" id="pct">0%</span>
    </div>
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="steps">
      <div class="step active" id="s1">AUTH</div>
      <div class="step" id="s2">VERIFY</div>
      <div class="step" id="s3">READY</div>
    </div>
  </div>
  <div class="footer"><span>RHM ERNY // SHADOW HOST</span><span class="corner">INITIALIZING…</span></div>
</section>
</main>

<script>
(function(){
  var bar=document.getElementById('bar'), pct=document.getElementById('pct'), status=document.getElementById('status');
  var steps=[document.getElementById('s1'),document.getElementById('s2'),document.getElementById('s3')];
  var progress=0;
  var timer=setInterval(function(){
    progress=Math.min(100,progress+Math.floor(Math.random()*8)+4);
    if(progress>=100) progress=100;
    bar.style.width=progress+'%'; pct.textContent=progress+'%';
    if(progress>=35){status.textContent='VERIFYING ENVIRONMENT';steps[0].className='step done';steps[1].className='step active'}
    if(progress>=70){status.textContent='LOADING JAILBREAK INTERFACE';steps[1].className='step done';steps[2].className='step active'}
    if(progress>=100){
      clearInterval(timer);status.textContent='SESSION READY';steps[2].className='step done';
      setTimeout(function(){location.href='jb.html';},450);
    }
  },120);
})();
</script>

</body>
</html>
