<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ZOOF13R // RUN // PS4 13.52</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050507;color:#eee;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
.card{width:min(900px,92vw);background:#0d0d11;border:1px solid #ff6600;border-radius:14px;padding:28px;box-shadow:0 0 35px #ff660044}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;letter-spacing:3px;color:#ff6600}.fw{font-family:monospace;color:#aaa}
.badge{display:inline-block;border:1px solid #555;border-radius:999px;padding:6px 10px;font:12px monospace;color:#aaa}
#state{font-size:20px;font-weight:800;margin:18px 0 8px}.bar{height:10px;background:#222;border-radius:99px;overflow:hidden}.fill{height:100%;width:3%;background:#ff6600;box-shadow:0 0 15px #ff6600;transition:width .15s}
#pct{font:12px monospace;color:#aaa;margin-top:7px}pre{height:340px;overflow:auto;background:#050507;border:1px solid #222;border-radius:8px;padding:14px;white-space:pre-wrap;word-break:break-word;font:12px Consolas,monospace;color:#bbb}
.ok{color:#56e39f}.bad{color:#ff5277}.warn{color:#ffd166}.actions{display:none;gap:10px;margin-top:15px}button{border:0;border-radius:7px;padding:12px 16px;background:#ff6600;font-weight:800;cursor:pointer}
.small{margin-top:10px;color:#666;font:11px monospace}
</style>
</head>
<body>
<div class="card">
  <div class="top"><div class="brand">★ ZOOF13R // RUN</div><div class="fw">PS4 FIRMWARE 13.52</div></div>
  <div id="badge" class="badge">INITIALIZING</div>
  <div id="state">Initializing WebKit exploit engine…</div>
  <div class="bar"><div id="fill" class="fill"></div></div>
  <div id="pct">03%</div>
  <pre id="out"></pre>
  <div class="actions" id="actions"><button onclick="location.reload()">RETRY</button></div>
  <div class="small">Keep this page open until the final status is reported.</div>
</div>
<script>
(function(){
  const badge=document.getElementById('badge'), state=document.getElementById('state'), fill=document.getElementById('fill'), pct=document.getElementById('pct'), out=document.getElementById('out'), actions=document.getElementById('actions');
  window.reportExploitProgress=function(stage,name,percent,detail){
    const p=Math.max(0,Math.min(100,Number(percent)||0));
    badge.textContent='[STAGE '+stage+'/6] '+name;
    state.textContent=name;
    fill.style.width=p+'%'; pct.textContent=String(Math.round(p)).padStart(2,'0')+'%';
    if(detail) append('[PROGRESS] '+detail,'');
  };
  function append(s,cls){ const line=document.createElement('div'); line.textContent='['+new Date().toLocaleTimeString()+'] '+s; if(cls)line.className=cls; out.appendChild(line); out.scrollTop=out.scrollHeight; }
  window.onZoofComplete=function(status){
    if(status && status.success){
      badge.textContent='[COMPLETED] PAYLOAD ACTIVE'; badge.className='badge ok'; state.textContent='GoldHEN / payload reported active'; fill.style.width='100%'; pct.textContent='100%'; append('SUCCESS: kernel patch and payload completed.','ok');
    } else { badge.textContent='[FAILED]'; badge.className='badge bad'; state.textContent='Exploit did not report a complete success'; actions.style.display='flex'; append('FAIL: completed='+!!(status&&status.completed)+' kpatched='+!!(status&&status.kpatched)+' payloadRunning='+!!(status&&status.payloadRunning),'bad'); }
  };
  window.showExploitError=function(msg){ badge.textContent='[EXPLOIT ERROR]'; badge.className='badge bad'; state.textContent='Exploit error — reboot/retry may be required'; actions.style.display='flex'; append('ERROR: '+(msg||'unknown'),'bad'); };
  window.addEventListener('error',function(e){append('JS ERROR: '+(e.message||e.error||'unknown'),'bad');});
  append('RUN launcher loaded. Target locked to PS4 13.52.','ok');
  append('Loading jb.js / core.js / memory / offsets…');
})();
</script>
<script type="module">
(async function () {
  const files = [
    ["jb.js", "JB ENGINE"],
    ["core.js", "CORE"],
    ["mem.js", "MEMORY"],
    ["int64.js", "INT64"],
    ["ps4_offsets.js", "OFFSETS 13.52"],
    ["patches/1352.bin", "PATCH 13.52"],
    ["goldhen.bin", "GOLDHEN"]
  ];
  try {
    for (const [path, label] of files) {
      const r = await fetch(path, { cache: "no-store" });
      if (!r.ok) throw new Error(label + " introuvable (HTTP " + r.status + ") : " + path);
      const b = await r.arrayBuffer();
      if (!b.byteLength) throw new Error(label + " vide : " + path);
      if (typeof append === "function") append("OK: " + label + " — " + b.byteLength + " octets", "ok");
    }
    if (typeof append === "function") append("Tous les fichiers 13.52 sont accessibles depuis GitHub Pages.", "ok");
    await import("./jb.js?fw=1352");
  } catch (e) {
    if (typeof showExploitError === "function") showExploitError(e && e.message ? e.message : String(e));
  }
})();
</script>
</body>
</html>
